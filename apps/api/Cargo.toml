[package]
name = "agreega-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
axum-governor = { version = "2.1.2", default-features = false, features = [
    "dashmap",
    "tracing",
] }
tower-http = { version = "0.7.1", features = ["cors"] }

tokio = { version = "1.54.1", features = ["full"] }

sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "uuid",
    "rust_decimal",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
validator = { version = "0.21", features = ["derive"] }

argon2 = "0.6"
jsonwebtoken = "11"
sha2 = "0.11.1"
hex = "0.4"
getrandom = "0.4"

uuid = { version = "1.29.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
ipnet = "2"
bytes = "1.12"

resend-rs = "0.35.0"

infer = "0.22"

dotenvy = "0.15"

tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
